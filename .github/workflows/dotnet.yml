name: .NET

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore module.remote-functions.sln
      - run: dotnet build module.remote-functions.sln --no-restore
      - run: dotnet test module.remote-functions.sln --no-build
